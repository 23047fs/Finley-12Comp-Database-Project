<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Project</title>
  <link rel="stylesheet" href="css/style.css">

  <!-- firebase start ****************************************-->
  <!-- Firebase App (core Firebase SDK) is always required & must be listed 1st -->
  <script src="https://www.gstatic.com/firebasejs/8.1.2/firebase-app.js"></script>
  <!-- Add Firebase products that you want to use -->
  <script src="https://www.gstatic.com/firebasejs/8.1.2/firebase-auth.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.1.2/firebase-database.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.1.2/firebase-analytics.js"></script>
  <!-- Include all your firebase libraries and scripts here -->
  <script src="fb-js/fb_setup.js"></script>
  <script src="fb-js/fb_io.js"></script>
  <!-- firebase end ******************************************-->
</head>
<body>
  <div id="title">
    <h1>Project</h1>
    <p>Login and register to begin.</p>
  </div>
  <br>
  <div id="loginButton">
    <button onclick="fb_login()">Login / Change name</button> <!--Normal Login-->
    <button onclick="fb_login(); inIndexPage();">Skip</button> <!--Skip by Check previous-->
  </div>
  <br>
  <div id="container">
    <div id="registrationTitle">
      <h1>Registration</h1>
    </div>
    <h3 class="warning">
      ⚠ Your name must be 3-20 characters long. <br> You must be 10 or greater years old.
    </h3>
    <div id="registrationForm">
      <!--User log in-->
      <form id="userForm" onsubmit="fb_write(); return false;">
        <!--User name-->
        <label for="userName">Your User Name:</label>
        <input type="text" id="userName" name="userName" minlength="3" maxlength="20" required>
        <br>
        <!--User age-->
        <label for="userAge">Your Age:</label>
        <input type="number" id="userAge" name="userAge" min="10" max="125" required>
        <button>Submit</button>
      </form>
      <!--Submit button-->
    </div>
    <br>
    <div id="databaseOutputCheck"></div>

    <script src="fb-js/fb_script.js"></script>
</body>

</html>
